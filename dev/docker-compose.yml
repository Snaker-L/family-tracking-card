# Home Assistant for developing this card.
#
# Runs as its own container with a persistent config directory, so the location
# history survives restarts. That is the whole point: the timeline can only be
# tested against data that is a few days old.
services:
  homeassistant:
    container_name: ha-dev
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ../../ha-dev/config:/config
      # The integration is copied in by scripts/deploy.mjs rather than mounted:
      # Home Assistant imports it as Python, and a read-only mount would keep it
      # from writing the __pycache__ it wants next to the sources.
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Vienna
    restart: unless-stopped
    ports:
      - "8123:8123"
