name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    # The built-in GITHUB_TOKEN may only read in a new repository. Without this
    # the run builds the card but fails to attach it, leaving a release with no
    # file -- and nothing for HACS to install.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: pytest tests -q

      # Builds the card straight into the integration, which then serves it.
      - run: yarn build

      # HACS installs an integration from a zip whose root is the contents of
      # custom_components/<domain>. Keeping the built bundle out of the
      # repository and inside the release is what lets both live here.
      - name: Package the integration
        run: |
          cd custom_components/family_tracking
          zip -r "$GITHUB_WORKSPACE/family_tracking.zip" . -x '*.pyc' -x '__pycache__/*'

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: family_tracking.zip
