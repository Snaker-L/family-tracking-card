name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - name: Attach card to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/family-tracking-card.js
